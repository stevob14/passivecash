name: Auto-Update CPI Data

on:
  schedule:
    # Runs on the 15th of every month at 14:00 UTC (after monthly BLS release)
    - cron: '0 14 15 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-cpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest BLS CPI data and update JS
        run: python scripts/update_cpi.py

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/inflation_calculator.js calculators.html
          if git diff --staged --quiet; then
            echo "No changes detected. CPI data is already up to date."
          else
            git commit -m "Auto-update CPI inflation data [skip ci]"
            git push
          fi
